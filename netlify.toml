# Netlify builds the Flutter web app from GitHub on every push.
# Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under
# Site configuration › Environment variables.
[build]
  command = "bash scripts/netlify_build.sh"
  publish = "build/web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always fetch the latest app shell so new deploys show up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"
