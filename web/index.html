<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Photo-first personal money tracker.">

  <!-- iOS: "Add to Home Screen" opens full screen (no Safari bars). An opaque
       status bar keeps the app below the clock, since Flutter's viewport
       doesn't expose safe-area insets. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#131418">
  <meta name="apple-mobile-web-app-title" content="Money">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Money Tracker</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the big downloads right away instead of after the bootstrap
       script runs: the app code, the rendering engine and the font CDN. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://dgwdjzjgaegjohqhogys.supabase.co" crossorigin>

  <!-- Matches the app's dark background around the home indicator. -->
  <style>
    html, body { background-color: #131418; margin: 0; }
    /* Shown instantly while Flutter loads; fades out on its first frame. */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #131418; transition: opacity 250ms ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 84px; height: 84px; border-radius: 22px; }
    #splash .name { color: #f2f3f7; font-size: 17px; font-weight: 600; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 2px; overflow: hidden;
      background: #2e3038;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #7fa8f8;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Money Tracker</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
